# Tự động deploy lên Firebase mỗi khi đẩy code lên nhánh main.
# Cần 1 secret trong GitHub: Settings → Secrets and variables → Actions → FIREBASE_SERVICE_ACCOUNT
# (nội dung file JSON tải ở Firebase Console → Project settings → Service accounts → Generate new private key)
name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # Kiểm thử quy tắc bảo mật Firestore trên emulator. Sai quy tắc thì không deploy.
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cài thư viện test
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Chạy test quy tắc bảo mật
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-cthd "node --test tests/firestore.rules.test.mjs" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            grep -E "^not ok|Error|AssertionError|expected" "$RUNNER_TEMP/test.log" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -E "^# (tests|pass|fail)" "$RUNNER_TEMP/test.log" | while IFS= read -r line; do echo "::notice::$line"; done

  deploy:
    needs: test-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kiểm tra secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Chưa có secret FIREBASE_SERVICE_ACCOUNT. Xem README, mục 'Tự động deploy bằng GitHub Actions'."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy Hosting (giao diện web)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@15.30.0 deploy --only hosting --project cong-tra-cuu-hoa-don --non-interactive 2>&1 | tee "$RUNNER_TEMP/hosting.log"; then
            grep -iE "error|denied|permission|not enabled|has not been used|403|404" "$RUNNER_TEMP/hosting.log" | tail -15 | while IFS= read -r line; do echo "::error::[hosting] $line"; done
            exit 1
          fi

      - name: Deploy Firestore rules
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npx --yes firebase-tools@15.30.0 deploy --only firestore --project cong-tra-cuu-hoa-don --non-interactive 2>&1 | tee "$RUNNER_TEMP/firestore.log"; then exit 0; fi
            echo "Lần $attempt thất bại, thử lại sau 30 giây…"; sleep 30
          done
          grep -iE "error|denied|permission|not enabled|has not been used|403|404" "$RUNNER_TEMP/firestore.log" | tail -15 | while IFS= read -r line; do echo "::error::[firestore] $line"; done
          exit 1

      - name: Xóa khóa tạm
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
